name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run check` = typecheck + lint + tests in one. Same command
      # CONTRIBUTING.md tells contributors to run before pushing, so a
      # green local run guarantees a green CI run.
      # Eval tests (test/eval/*) are gated behind RUN_EVALS=1 so CI
      # never spends real Anthropic credits.
      - name: Check (typecheck + lint + tests)
        run: bun run check
