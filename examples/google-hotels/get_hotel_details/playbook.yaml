toolName: get_hotel_details
summary: Fetch detailed Google Hotels information for a selected hotel result.
parameters:
  - name: hotel_token
    type: string
    description: Google Hotels selected result token for the hotel.
  - name: destination
    type: string
    description: Destination context used when opening the hotel result.
  - name: check_in_date
    type: string
    description: Check-in date in YYYY-MM-DD format when supplied.
  - name: check_out_date
    type: string
    description: Check-out date in YYYY-MM-DD format when supplied.
  - name: property_type
    type: string
    description: Property type context such as hotels or vacation_rentals.
steps:
  - action: navigate
    url: "https://www.google.com/travel/search?q=${destination}&qs=${hotel_token}"
    wait_for: networkidle
  - action: click
    locators:
      - by: aria_label
        value_pattern: "${destination}"
      - by: text
        value_pattern: "${destination}"
      - by: css
        value: "a[href*='${hotel_token}']"
    wait_for:
      xhr: "rpcids=AtySUc"
  - action: wait
    wait_for: networkidle
result:
  source: xhr
  url_pattern: "rpcids=AtySUc"
  extract: "0.2"
  return_as: hotel_details
notes: "Google Travel detail payloads are returned through batchexecute AtySUc responses as encoded nested arrays; session-bound query fields such as f.sid, bl, and _reqid should not be treated as user parameters."
