toolName: get_travel_area_boundaries
summary: Fetch Google Travel map boundary geometry for a hotel destination.
parameters:
  - name: place_id
    type: string
    description: Google place or knowledge graph ID for the destination.
  - name: latitude
    type: number
    description: Latitude for the destination center.
  - name: longitude
    type: number
    description: Longitude for the destination center.
steps:
  - action: navigate
    url: "https://www.google.com/travel/search?qs=OAA"
    wait_for: networkidle
  - action: type
    locators:
      - by: role
        value: textbox
        name: "Search for places, hotels and more"
      - by: aria_label
        value: "Search for places, hotels and more"
      - by: css
        value: "input[aria-label='Search for places, hotels and more']"
    value: ${place_id}
    wait_for:
      sleep_ms: 500
  - action: press
    key: Enter
    wait_for:
      xhr: "rpcids=FCE32b"
result:
  source: xhr
  url_pattern: "rpcids=FCE32b"
  extract: "[].2"
  return_as: area_boundaries
notes: "Google Travel resolves destination text through session-bound batchexecute state before FCE32b; latitude and longitude are retained as workflow parameters for parity with the API workflow and validation against the returned boundary center."
