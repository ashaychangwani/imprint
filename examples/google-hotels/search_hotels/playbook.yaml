toolName: search_hotels
summary: Search Google Hotels for lodging options with dates, travelers, filters, property type, and sorting.
parameters:
  - name: destination
    type: string
    description: Destination query or place name such as Chicago Loop, Tahoe City, or Denver Downtown.
  - name: check_in_date
    type: string
    description: Check-in date in YYYY-MM-DD format.
  - name: check_out_date
    type: string
    description: Check-out date in YYYY-MM-DD format.
  - name: adults
    type: number
    description: Number of adult travelers.
  - name: children
    type: number
    description: Number of child travelers if included.
    default: 0
  - name: currency
    type: string
    description: Currency code for returned prices, for example USD.
    default: USD
  - name: min_price
    type: number
    description: Minimum price filter.
  - name: max_price
    type: number
    description: Maximum price filter.
  - name: min_rating
    type: number
    description: Minimum guest rating filter, for example 4.0.
    default: 4
  - name: amenities
    type: string
    description: Comma-separated amenities to require, such as free Wi-Fi, free breakfast, parking, pet-friendly, fitness center, spa, pools, wheelchair accessible, beach access, or all-inclusive.
  - name: hotel_classes
    type: string
    description: Comma-separated star classes to include, such as 2, 3, 4, or 5.
  - name: brands
    type: string
    description: Comma-separated hotel brand or chain filters.
  - name: sort_order
    type: string
    description: Sort option such as relevance, lowest_price, highest_rating, or most_reviewed.
    default: relevance
  - name: property_type
    type: string
    description: Property type such as hotels or vacation_rentals.
    default: hotels
steps:
  - action: navigate
    url: "https://www.google.com/travel/search?qs=OAA"
    wait_for: networkidle
  - action: type
    locators:
      - by: role
        value: textbox
        name: "Search for places, hotels and more"
      - by: aria_label
        value: "Search for places, hotels and more"
      - by: css
        value: "input[aria-label='Search for places, hotels and more']"
    value: ${destination}
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: text
        value_pattern: "${destination} hotels"
      - by: text
        value_pattern: ${destination}
      - by: css
        value: "ul li"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: role
        value: textbox
        name: "Check-in"
      - by: aria_label
        value: Check-in
      - by: css
        value: "input[aria-label='Check-in']"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: aria_label
        value_pattern: ${check_in_date}
      - by: css
        value: "[aria-label*='${check_in_date}']"
    wait_for: visible
  - action: click
    locators:
      - by: aria_label
        value_pattern: ${check_out_date}
      - by: css
        value: "[aria-label*='${check_out_date}']"
    wait_for: visible
  - action: click
    locators:
      - by: role
        value: button
        name: Done
      - by: text
        value: Done
      - by: css
        value: "button span:has-text('Done')"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: aria_label
        value_pattern: "Number of travelers"
      - by: text
        value_pattern: "Number of travelers"
      - by: css
        value: "[aria-label*='Number of travelers']"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: aria_label
        value_pattern: "Add adult"
      - by: text
        value_pattern: "Add adult"
      - by: css
        value: "button[aria-label*='Add adult']"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: text
        value: "4+ rating"
      - by: role
        value: button
        name: "4+ rating"
      - by: css
        value: "button:has-text('4+ rating')"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: role
        value: button
        name: "All filters"
      - by: text
        value_pattern: "All filters"
      - by: css
        value: "button:has-text('All filters')"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: text
        value_pattern: "${min_price}"
      - by: text
        value_pattern: "${max_price}"
      - by: css
        value: "section [role='slider']"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: aria_label
        value_pattern: ${amenities}
      - by: text
        value_pattern: ${amenities}
      - by: css
        value: "input[type='checkbox']"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: aria_label
        value_pattern: "${hotel_classes}-star"
      - by: text
        value_pattern: "${hotel_classes}-star"
      - by: css
        value: "input[type='checkbox']"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: text
        value_pattern: ${brands}
      - by: aria_label
        value_pattern: ${brands}
      - by: css
        value: "input[type='checkbox']"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: text
        value_pattern: ${sort_order}
      - by: role
        value: radio
        name: ${sort_order}
      - by: css
        value: "input[type='radio'][name]"
    wait_for:
      xhr: AtySUc
  - action: click
    locators:
      - by: text
        value_pattern: ${property_type}
      - by: role
        value: radio
        name: ${property_type}
      - by: css
        value: "input[type='radio']"
    wait_for:
      xhr: AtySUc
result:
  source: xhr
  url_pattern: "rpcids=AtySUc"
  extract: "0[].2"
  return_as: lodging_results
notes: Google Travel batchexecute responses contain the AtySUc hotel results as a string-encoded nested array in the wrb.fr envelope; session-bound values such as f.sid, bl, _reqid, and result tokens should not be treated as user parameters.
