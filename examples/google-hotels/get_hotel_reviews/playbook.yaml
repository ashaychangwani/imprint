toolName: get_hotel_reviews
summary: Fetch review data for a selected Google Hotels property.
parameters:
  - name: hotel_token
    type: string
    description: Google Hotels selected hotel token.
steps:
  - action: navigate
    url: "https://www.google.com/travel/search?qs=${hotel_token}"
    wait_for: networkidle
  - action: wait
    wait_for:
      xhr: "rpcids=ocp93e"
result:
  source: xhr
  url_pattern: "rpcids=ocp93e"
  extract: "[]"
  return_as: reviews
notes: "The ocp93e batchexecute response is a Google envelope whose review payload is returned as an encoded JSON string inside the wrb.fr tuple; downstream parsing should unwrap the batchexecute prefix and parse the ocp93e payload string."
