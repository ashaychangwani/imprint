toolName: suggest_hotel_destinations
summary: Suggest Google Hotels destinations and properties from a partial search query.
parameters:
  - name: query
    type: string
    description: Partial destination, neighborhood, hotel, or lodging query.
    default: denver downtown
  - name: max_results
    type: number
    description: Maximum number of suggestions to request and return.
    default: 0
  - name: limit
    type: number
    description: Backward-compatible alias for max_results. Zero uses the default of 15.
    default: 0
steps:
  - action: navigate
    url: https://www.google.com/travel/search?qs=OAA
    wait_for: networkidle
  - action: type
    locators:
      - by: role
        value: textbox
        name: Search for places, hotels and more
      - by: aria_label
        value: Search for places, hotels and more
      - by: css
        value: "input[aria-label=\"Search for places, hotels and more\"]"
    value: "${query}"
    wait_for:
      xhr: "rpcids=mejVKc"
result:
  source: dom
  locators:
    - by: role
      value: option
    - by: css
      value: "ul.F3AVKd > li.Q1RWxd"
  extract: text
  return_as: suggestions
notes: "Return at most max_results (or legacy limit) suggestions in DOM order, defaulting to 15 when both are zero. Prior-search contextualization is omitted because verified context strings did not change results; Google controls the internal autocomplete mode and may expose richer property metadata only in the underlying mejVKc response."
