toolName: suggest_hotel_destinations
summary: Get Google Hotels destination and hotel autocomplete suggestions for a typed query.
parameters:
  - name: query
    type: string
    description: Partial or full destination or hotel search text.
  - name: previous_query
    type: string
    description: Prior search context used by Google suggestions when present.
    default: ""
  - name: limit
    type: number
    description: Maximum number of suggestions requested.
    default: 10
steps:
  - action: navigate
    url: "https://www.google.com/travel/search?qs=OAA"
    wait_for: networkidle
  - action: click
    locators:
      - by: role
        value: textbox
        name: "Search for places, hotels and more"
      - by: aria_label
        value: "Search for places, hotels and more"
      - by: css
        value: "input[aria-label=\"Search for places, hotels and more\"]"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: textbox
        name: "Search for places, hotels and more"
      - by: aria_label
        value: "Search for places, hotels and more"
      - by: css
        value: "input[aria-label=\"Search for places, hotels and more\"]"
    value: ${query}
    wait_for:
      xhr: "rpcids=mejVKc"
result:
  source: xhr
  url_pattern: "rpcids=mejVKc"
  extract: "0.2[]"
  return_as: suggestions
notes: "The mejVKc response is a Google batchexecute envelope; the third wrb.fr field is a JSON-encoded suggestions array containing suggestion type, display text, highlighted fragments, thumbnail URL, address, place ID, hotel identifier, hotel-search flag, and canonical query text. Session-bound URL parameters such as f.sid, bl, and _reqid should be supplied by the browser session rather than treated as user inputs."
