toolName: list_hotel_booking_options
summary: List booking providers and prices for a selected Google Hotels stay, switch prices to stay total, and expand additional options.
parameters:
  - name: hotel_token
    type: string
    description: Google Hotels selected hotel token.
  - name: check_in_date
    type: string
    description: Check-in date in YYYY-MM-DD format.
  - name: check_out_date
    type: string
    description: Check-out date in YYYY-MM-DD format.
  - name: adults
    type: number
    description: Number of adult travelers.
  - name: children
    type: number
    description: Number of child travelers if included.
    default: 0
  - name: currency
    type: string
    description: Currency code for prices, for example USD.
    default: USD
  - name: price_display
    type: string
    description: Pricing display mode such as nightly or stay_total.
    default: stay_total
  - name: page_token
    type: string
    description: Continuation token used to fetch more booking options.
    default: ""
steps:
  - action: navigate
    url: "https://www.google.com/travel/search?qs=${hotel_token}"
    wait_for: networkidle
  - action: click
    locators:
      - by: role
        value: tab
        name: Prices
      - by: text
        value: Prices
      - by: css
        value: "div.xQwpfc.Qy8UDd div.mrslJ"
    wait_for:
      xhr: "rpcids=M0CRd"
  - action: click
    locators:
      - by: role
        value: button
        name: Nightly price with fees
      - by: text
        value: Nightly price with fees
      - by: css
        value: "button.VfPpkd-LgbsSe.VfPpkd-LgbsSe-OWXEXe-INsAgc"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: radio
        name: Stay total
      - by: text
        value: Stay total
      - by: css
        value: "label.LLYsl"
    wait_for: visible
  - action: click
    locators:
      - by: role
        value: button
        name: Done
      - by: text
        value: Done
      - by: css
        value: "div.g3VIld.Fqio0e button.VfPpkd-LgbsSe-OWXEXe-k8QpJ"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: button
        name: "View more options"
      - by: text
        value_pattern: "View more options"
      - by: css
        value: "button.VfPpkd-LgbsSe.ksBjEc"
    wait_for:
      xhr: "rpcids=M0CRd"
result:
  source: xhr
  url_pattern: "rpcids=M0CRd"
  extract: "[]"
  return_as: booking_options
notes: "The M0CRd batchexecute payload is returned as a nested Google response envelope containing provider offers, displayed prices, total prices, booking URLs, room labels, benefits, and continuation state. Session-bound request parameters such as f.sid, bl, and _reqid should be regenerated by the browser session, not supplied as user inputs."
