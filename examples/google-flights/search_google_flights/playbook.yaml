toolName: search_google_flights
summary: Search Google Flights for round-trip flights between two airports on specific dates.
parameters:
  - name: origin_airport
    type: string
    description: Origin airport or city code, e.g. SJC
  - name: destination_airport
    type: string
    description: Destination airport or city code, e.g. SAN
  - name: depart_date
    type: string
    description: Departure date in YYYY-MM-DD format
  - name: return_date
    type: string
    description: Return date in YYYY-MM-DD format
steps:
  - action: navigate
    url: https://www.google.com/travel/flights
    wait_for: networkidle
  - action: type
    locators:
      - by: role
        value: textbox
        name: Where from?
      - by: aria_label
        value: Where from?
      - by: css
        value: input[aria-label="Where from?"]
    value: ${origin_airport}
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: option
        name: ${origin_airport}
      - by: aria_label
        value_pattern: ${origin_airport}
      - by: text
        value_pattern: ${origin_airport}
      - by: css
        value: ul li
    wait_for: visible
  - action: type
    locators:
      - by: role
        value: textbox
        name: Where to?
      - by: aria_label
        value: "Where to? "
      - by: css
        value: input[aria-label="Where to? "]
    value: ${destination_airport}
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: option
        name: ${destination_airport}
      - by: aria_label
        value_pattern: ${destination_airport}
      - by: text
        value_pattern: ${destination_airport}
      - by: css
        value: ul li
    wait_for: visible
  - action: type
    locators:
      - by: role
        value: textbox
        name: Departure
      - by: aria_label
        value: Departure
      - by: css
        value: input[aria-label="Departure"]
    value: ${depart_date}
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: textbox
        name: Return
      - by: aria_label
        value: Return
      - by: css
        value: input[aria-label="Return"]
    value: ${return_date}
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: button
        name: Search
      - by: aria_label
        value_pattern: Search
      - by: css
        value: button
    wait_for:
      xhr: /FlightsFrontendService/GetShoppingResults
  - action: click
    locators:
      - by: aria_label
        value: Nonstop flight.
      - by: text
        value: Nonstop
      - by: css
        value: div.OgQvJf.nKlB3b
    wait_for:
      xhr: /FlightsFrontendService/GetShoppingResults
  - action: click
    locators:
      - by: aria_label
        value: Nonstop flight.
      - by: text
        value: Nonstop
      - by: css
        value: div.OgQvJf.nKlB3b
    wait_for:
      xhr: /FlightsFrontendService/GetBookingResults
result:
  source: dom
  locators:
    - by: css
      value: a[href*="/travel/clk/f"]
  extract: href
  return_as: booking_links
notes: Assumes Google Flights opens in round-trip Economy (include Basic) by default and selects the first visible outbound and return flight cards, which in the captured session were nonstop Southwest options.
