toolName: validate_flight_itinerary
summary: Validate whether a Google Flights itinerary's selected legs are accepted before running a full search.
parameters:
  - name: itinerary
    type: string
    description: Ordered origin and destination pairs, using airport codes or place ids.
  - name: trip_type
    type: string
    description: Ticket type such as round_trip, one_way, or multi_city.
steps:
  - action: navigate
    url: https://www.google.com/travel/flights
    wait_for: networkidle
  - action: click
    locators:
      - by: role
        value: button
        name: Round trip
      - by: aria_label
        value: Select your ticket type.
      - by: text
        value: Round trip
      - by: css
        value: div.TQYpgc.gInvKb div.VfPpkd-TkwUic
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: option
        name: ${trip_type}
      - by: text
        value_pattern: ${trip_type}
      - by: css
        value: ul.VfPpkd-rymPhb.r6B9Fd > li.MCs1Pd.UbEQCe
    wait_for:
      sleep_ms: 500
  - action: type
    locators:
      - by: aria_label
        value_pattern: Where from
      - by: text
        value_pattern: Where from
      - by: css
        value: input[aria-label*="Where from"]
    value: ${itinerary}
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: text
        value_pattern: ${itinerary}
      - by: aria_label
        value_pattern: ${itinerary}
      - by: css
        value: ul.DFGgtd > li.n4HaVc
    wait_for: visible
  - action: type
    locators:
      - by: aria_label
        value_pattern: Where to
      - by: text
        value_pattern: Where to
      - by: css
        value: input[aria-label*="Where to"]
    value: ${itinerary}
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: text
        value_pattern: ${itinerary}
      - by: aria_label
        value_pattern: ${itinerary}
      - by: css
        value: ul.DFGgtd > li.n4HaVc
    wait_for:
      xhr: BVAT3
result:
  source: xhr
  url_pattern: BVAT3
  extract: "[2][]"
  return_as: validation_flags
notes: The BVAT3 response is inside Google batchexecute's wrb.fr payload; strip the JSON prefix and decode the nested payload before applying the extract path.
