toolName: lookup_flight_locations
summary: Search Google Flights location autocomplete for airports, cities, and travel places by text query.
parameters:
  - name: query
    type: string
    description: Partial or full airport, city, or place query typed by the user.
  - name: location_types
    type: string
    description: Optional comma-separated type filters such as airport, city, region, or all.
    default: all
steps:
  - action: navigate
    url: "https://www.google.com/travel/flights"
    wait_for: networkidle
  - action: click
    locators:
      - by: role
        value: textbox
        name: "Where from?"
      - by: aria_label
        value_pattern: "Where from\\??\\s*$"
      - by: text
        value_pattern: "Where from"
      - by: css
        value: "input[aria-label^=\"Where from\"]"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: textbox
        name: "Where else?"
      - by: aria_label
        value_pattern: "Where (else|from|to)\\??"
      - by: css
        value: "div.lJj3Hd input.II2One"
      - by: css
        value: "input[aria-label^=\"Where\"]"
    value: "${query}"
    wait_for:
      xhr: "rpcids=H028ib"
result:
  source: xhr
  url_pattern: "rpcids=H028ib"
  extract: "0.0.2"
  return_as: locations
notes: "The H028ib batchexecute response wraps the ranked location matches as a JSON-encoded string at the first wrb.fr record's payload; downstream parsing should remove the Google prefix, parse the batchexecute envelope, then parse this payload. The DOM autocomplete does not expose a visible location_types filter, so filtering should be applied after extraction when location_types is not all."
