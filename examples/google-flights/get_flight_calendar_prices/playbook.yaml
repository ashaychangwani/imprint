toolName: get_flight_calendar_prices
summary: Get Google Flights calendar fare prices for a route after opening the date picker.
parameters:
  - name: origin
    type: string
    description: Origin airport code, city code, or place identifier.
  - name: destination
    type: string
    description: Destination airport code, city code, or place identifier.
  - name: trip_type
    type: string
    description: Trip type such as round_trip or one_way.
    default: round_trip
  - name: start_date
    type: string
    description: Start of date range in YYYY-MM-DD format.
  - name: end_date
    type: string
    description: End of date range in YYYY-MM-DD format.
  - name: trip_length
    type: string
    description: Optional desired trip length or min/max nights for round-trip calendars.
    default: "7 nights"
steps:
  - action: navigate
    url: "https://www.google.com/travel/flights"
    wait_for: networkidle
  - action: click
    locators:
      - by: role
        value: button
        name: Round trip
      - by: text
        value: Round trip
      - by: css
        value: "div.TQYpgc.gInvKb div.VfPpkd-aPP78e"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: option
        name: Round trip
      - by: text
        value: Round trip
      - by: css
        value: "ul[aria-label='Select your ticket type.'] li"
    wait_for: visible
  - action: click
    locators:
      - by: aria_label
        value: Where from?
      - by: text
        value_pattern: Where from
      - by: css
        value: "input[aria-label^='Where from']"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: aria_label
        value: Where else?
      - by: aria_label
        value_pattern: Where from
      - by: css
        value: "input.II2One"
    value: "${origin}"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: aria_label
        value_pattern: "${origin}"
      - by: text
        value_pattern: "${origin}"
      - by: css
        value: "ul.DFGgtd li"
    wait_for: visible
  - action: click
    locators:
      - by: aria_label
        value: "Where to? "
      - by: text
        value_pattern: Where to
      - by: css
        value: "input[aria-label^='Where to']"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: aria_label
        value: "Where to? "
      - by: aria_label
        value: Where else?
      - by: css
        value: "input.II2One"
    value: "${destination}"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: aria_label
        value_pattern: "${destination}"
      - by: text
        value_pattern: "${destination}"
      - by: css
        value: "ul.DFGgtd li"
    wait_for: visible
  - action: click
    locators:
      - by: aria_label
        value: Departure
      - by: text
        value_pattern: Departure
      - by: css
        value: "input[aria-label='Departure']"
    wait_for:
      xhr: GetCalendarPicker
result:
  source: xhr
  url_pattern: GetCalendarPicker
  extract: "wrb.fr"
  return_as: calendar_prices
notes: Google Flights returns the calendar response inside a batchexecute/WIZ envelope; downstream parsing must strip the JSON prefix, parse the wrb.fr payload string, and map each fare row as departure date, return date, price amount, encoded selection token, and availability flag. The captured calendar for SJC to SAN returned rows shaped like date, return date, price tuple, and flag, e.g. 2026-06-08 to 2026-06-15 at 242 USD.
