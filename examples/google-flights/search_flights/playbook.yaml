toolName: search_flights
summary: Search Google Flights for flight options by trip type, route, dates, passengers, and optional filters.
parameters:
  - name: trip_type
    type: string
    description: Ticket type such as round_trip, one_way, or multi_city.
    default: round_trip
  - name: origin
    type: string
    description: Origin airport code, city code, or place identifier for one-way and round-trip searches.
  - name: destination
    type: string
    description: Destination airport code, city code, or place identifier for one-way and round-trip searches.
  - name: departure_date
    type: string
    description: Departure date in YYYY-MM-DD format.
  - name: return_date
    type: string
    description: Return date in YYYY-MM-DD format for round-trip searches.
  - name: itinerary
    type: string
    description: For multi-city searches, ordered legs as origin, destination, and date entries.
  - name: adults
    type: number
    description: Number of adult passengers.
    default: 1
  - name: stops
    type: string
    description: Stops filter, such as any, nonstop_only, one_stop_or_fewer, or two_stops_or_fewer.
    default: any
  - name: airlines
    type: string
    description: Comma-separated airline or alliance codes to include, such as AS, AA, WN, ONEWORLD, SKYTEAM, or STAR_ALLIANCE.
  - name: bags
    type: number
    description: Number of bags to include in fare filtering.
    default: 0
  - name: max_price
    type: number
    description: Maximum fare price in USD.
  - name: outbound_time_range
    type: string
    description: Outbound departure or arrival time constraints encoded as start and end hours.
  - name: return_time_range
    type: string
    description: Return departure or arrival time constraints encoded as start and end hours.
  - name: max_duration_minutes
    type: number
    description: Maximum flight duration in minutes.
steps:
  - action: navigate
    url: https://www.google.com/travel/flights
    wait_for: networkidle
  - action: click
    locators:
      - by: role
        value: button
        name: Round trip
      - by: aria_label
        value: Select your ticket type.
      - by: text
        value: Round trip
      - by: css
        value: "div.TQYpgc.gInvKb div.VfPpkd-aPP78e"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: option
        name: "${trip_type}"
      - by: text
        value_pattern: "${trip_type}"
      - by: css
        value: "ul[aria-label='Select your ticket type.'] li"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: textbox
        name: Where from?
      - by: aria_label
        value_pattern: Where from
      - by: text
        value_pattern: Where from
      - by: css
        value: "input[aria-label*='Where from']"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: textbox
        name: Where else?
      - by: aria_label
        value_pattern: Where else
      - by: aria_label
        value_pattern: Where from
      - by: css
        value: "input[aria-label*='Where']"
    value: "${origin}"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: option
        name: "${origin}"
      - by: aria_label
        value_pattern: "${origin}"
      - by: text
        value_pattern: "${origin}"
      - by: css
        value: "ul.DFGgtd li"
    wait_for: visible
  - action: click
    locators:
      - by: role
        value: textbox
        name: Where to?
      - by: aria_label
        value_pattern: Where to
      - by: text
        value_pattern: Where to
      - by: css
        value: "input[aria-label*='Where to']"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: textbox
        name: Where to?
      - by: aria_label
        value_pattern: Where to
      - by: aria_label
        value_pattern: Where else
      - by: css
        value: "input[aria-label*='Where']"
    value: "${destination}"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: option
        name: "${destination}"
      - by: aria_label
        value_pattern: "${destination}"
      - by: text
        value_pattern: "${destination}"
      - by: css
        value: "ul.DFGgtd li"
    wait_for: visible
  - action: click
    locators:
      - by: role
        value: textbox
        name: Departure
      - by: aria_label
        value: Departure
      - by: text
        value: Departure
      - by: css
        value: "input[aria-label='Departure']"
    wait_for:
      xhr: GetCalendarPicker
  - action: type
    locators:
      - by: role
        value: textbox
        name: Departure
      - by: aria_label
        value: Departure
      - by: css
        value: "input[aria-label='Departure']"
    value: "${departure_date}"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: textbox
        name: Return
      - by: aria_label
        value: Return
      - by: css
        value: "input[aria-label='Return']"
    value: "${return_date}"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: button
        name: Done
      - by: text
        value: Done
      - by: css
        value: "button span.VfPpkd-vQzf8d"
    wait_for:
      sleep_ms: 500
  - action: click
    locators:
      - by: role
        value: button
        name: Search
      - by: text
        value: Search
      - by: css
        value: "button span.VfPpkd-vQzf8d"
    wait_for:
      xhr: GetShoppingResults
  - action: click
    locators:
      - by: role
        value: button
        name: Stops
      - by: text
        value: Stops
      - by: aria_label
        value_pattern: Stops
      - by: css
        value: "button:has-text('Stops')"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: radio
        name: "${stops}"
      - by: text
        value_pattern: "${stops}"
      - by: css
        value: "input[name='itEVCd']"
    wait_for:
      xhr: GetShoppingResults
  - action: click
    locators:
      - by: role
        value: button
        name: Airlines
      - by: text
        value: Airlines
      - by: aria_label
        value_pattern: Airlines
      - by: css
        value: "button:has-text('Airlines')"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: checkbox
        name: "${airlines}"
      - by: text
        value_pattern: "${airlines}"
      - by: aria_label
        value_pattern: "${airlines}"
      - by: css
        value: "input[type='checkbox']"
    wait_for:
      xhr: GetShoppingResults
  - action: click
    locators:
      - by: role
        value: button
        name: Bags
      - by: text
        value: Bags
      - by: aria_label
        value_pattern: Bags
      - by: css
        value: "button:has-text('Bags')"
    wait_for:
      sleep_ms: 300
  - action: click
    locators:
      - by: role
        value: button
        name: Add bag
      - by: aria_label
        value_pattern: Add
      - by: text
        value_pattern: Add
      - by: css
        value: "button[aria-label*='Add']"
    wait_for:
      xhr: GetShoppingResults
  - action: click
    locators:
      - by: role
        value: button
        name: Price
      - by: text
        value: Price
      - by: aria_label
        value_pattern: Price
      - by: css
        value: "button:has-text('Price')"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: slider
        name: Price
      - by: aria_label
        value_pattern: Price
      - by: text
        value_pattern: "$"
      - by: css
        value: "div.GegIwe div.Cs7q4e"
    value: "${max_price}"
    wait_for:
      xhr: GetShoppingResults
  - action: click
    locators:
      - by: role
        value: button
        name: Times
      - by: text
        value: Times
      - by: aria_label
        value_pattern: Times
      - by: css
        value: "button:has-text('Times')"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: slider
        name: Outbound
      - by: aria_label
        value_pattern: Outbound
      - by: text
        value_pattern: Departure
      - by: css
        value: "div.PlyoXe div.Cs7q4e"
    value: "${outbound_time_range}"
    wait_for:
      xhr: GetShoppingResults
  - action: type
    locators:
      - by: role
        value: slider
        name: Return
      - by: aria_label
        value_pattern: Return
      - by: text
        value: Return
      - by: css
        value: "button#id_1"
    value: "${return_time_range}"
    wait_for:
      xhr: GetShoppingResults
  - action: click
    locators:
      - by: role
        value: button
        name: Duration
      - by: text
        value: Duration
      - by: aria_label
        value_pattern: Duration
      - by: css
        value: "button:has-text('Duration')"
    wait_for:
      sleep_ms: 300
  - action: type
    locators:
      - by: role
        value: slider
        name: Duration
      - by: aria_label
        value_pattern: Duration
      - by: text
        value_pattern: Under
      - by: css
        value: "div.uKklMc div.Cs7q4e"
    value: "${max_duration_minutes}"
    wait_for:
      xhr: GetShoppingResults
result:
  source: xhr
  url_pattern: GetShoppingResults
  extract: "0.0.2"
  return_as: flight_results
notes: "Google Flights returns batchexecute payloads with an anti-XSSI prefix and nested JSON strings. Strip the prefix, parse the outer batchexecute records, then parse the wrb.fr payload at extract path 0.0.2 to obtain the shopping results array containing leg groups, fares, prices, booking or selection tokens, airlines, times, durations, stops, and emissions. For multi_city searches, expand itinerary into repeated leg origin, destination, and date interactions before clicking Search."
