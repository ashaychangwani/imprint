toolName: search_flights
summary: Search Southwest flight options and fares for a route and travel date.
parameters:
  - name: origination_airport_code
    type: string
    description: Origin airport code such as SJC.
  - name: destination_airport_code
    type: string
    description: Destination airport code such as SAN.
  - name: departure_date
    type: string
    description: Outbound departure date in YYYY-MM-DD format.
  - name: return_date
    type: string
    description: Return date in YYYY-MM-DD format for round trips; blank for one-way searches.
    default: ""
  - name: trip_type
    type: string
    description: Trip type, for example oneway or roundtrip.
    default: oneway
  - name: adults_count
    type: number
    description: Number of adult passengers.
    default: 1
  - name: departure_time_of_day
    type: string
    description: Outbound time-of-day filter such as ALL_DAY.
    default: ALL_DAY
  - name: return_time_of_day
    type: string
    description: Return time-of-day filter such as ALL_DAY.
    default: ALL_DAY
  - name: fare_type
    type: string
    description: Fare currency or payment type such as USD.
    default: USD
  - name: promo_code
    type: string
    description: Optional Southwest promo code.
    default: ""
steps:
  - action: navigate
    url: "https://www.southwest.com/air/booking/select-depart.html?adultsCount=${adults_count}&adultPassengersCount=${adults_count}&destinationAirportCode=${destination_airport_code}&departureDate=${departure_date}&departureTimeOfDay=${departure_time_of_day}&fareType=${fare_type}&originationAirportCode=${origination_airport_code}&passengerType=ADULT&promoCode=${promo_code}&returnDate=${return_date}&returnTimeOfDay=${return_time_of_day}&tripType=${trip_type}"
    wait_for:
      xhr: /api/air-booking/v1/air-booking/page/air/booking/shopping
      method: POST
result:
  source: xhr
  url_pattern: /api/air-booking/v1/air-booking/page/air/booking/shopping
  extract: "data.searchResults"
  return_as: flight_search_results
notes: Login is handled separately; this playbook starts from a browser context with Southwest cookies/session headers already available.
