toolName: get_account_details
summary: Get Southwest Rapid Rewards account details for the logged-in user.
parameters: []
steps:
  - action: navigate
    url: "https://www.southwest.com/loyalty/myaccount/"
    wait_for: networkidle
  - action: wait
    wait_for:
      xhr: "/api/security/v4/security/userinfo"
  - action: wait
    wait_for:
      xhr: "/api/loyalty-management/v2/loyalty-management/accounts/self/customer-details-secure"
result:
  source: xhr
  url_pattern: "/api/loyalty-management/v2/loyalty-management/accounts/self/customer-details-secure"
  extract: data
  return_as: account_details
notes: "The my account page also calls /api/security/v4/security/userinfo, which contains email, phone, and duplicate Rapid Rewards status fields; use it as a companion account-details response when contact fields are required."
